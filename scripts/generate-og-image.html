<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .og-container {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .og-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(124, 58, 237, 0.1) 50%, rgba(5, 150, 105, 0.1) 100%);
            pointer-events: none;
        }
        .brand {
            font-size: 48px;
            font-weight: bold;
            color: #3B82F6;
            margin-bottom: 20px;
            z-index: 1;
        }
        .title {
            font-size: 36px;
            font-weight: 600;
            color: #F8FAFC;
            margin-bottom: 20px;
            z-index: 1;
        }
        .subtitle {
            font-size: 24px;
            color: #CBD5E1;
            margin-bottom: 40px;
            z-index: 1;
        }
        .features {
            z-index: 1;
        }
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 20px;
            color: #E2E8F0;
        }
        .feature::before {
            content: '✓';
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #10B981;
            border-radius: 50%;
            margin-right: 16px;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            color: white;
            font-weight: bold;
        }
        .cta {
            font-size: 18px;
            color: #94A3B8;
            margin-top: 40px;
            font-style: italic;
            z-index: 1;
        }
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.05;
            background-image: 
                linear-gradient(rgba(248, 250, 252, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(248, 250, 252, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body>
    <div class="og-container">
        <div class="grid-bg"></div>
        <div class="brand">attend75</div>
        <div class="title">Smart Attendance Calculator</div>
        <div class="subtitle">Strategic leave management & safe bunking calculator</div>
        <div class="features">
            <div class="feature">Calculate safe bunking with medical & duty leaves</div>
            <div class="feature">Get strategic insights for optimal attendance</div>
            <div class="feature">Future projections & leave unlock predictions</div>
        </div>
        <div class="cta">Built for students who want to attend smartly, not just frequently</div>
    </div>

    <script>
        // Instructions: 
        // 1. Open this HTML file in a browser
        // 2. Take a screenshot of the container (1200x630)
        // 3. Save as og-image.png in the public folder
        console.log('Open browser dev tools, set viewport to 1200x630, and take a screenshot');
        console.log('Save the screenshot as og-image.png in the public folder');
    </script>
</body>
</html>
